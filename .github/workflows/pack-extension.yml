name: Pack extension

on:
  # After Bump version finishes on main — this is the run that builds zips
  # and attaches them to the GitHub Release for the new tag.
  workflow_run:
    workflows: ["Bump version"]
    types: [completed]

  push:
    branches: ["cursor/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  pack:
    name: Build browser packages
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_run.head_sha is the merge that *triggered* the bump (old
          # version). Check out main + newest v* tag instead after bump.
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
          fetch-depth: 0

      - name: Check out newest release tag (post-bump)
        if: ${{ github.event_name == 'workflow_run' }}
        run: |
          set -euo pipefail
          git fetch --tags origin
          TAG="$(git tag -l 'v*' --sort=-v:refname | head -n1)"
          if [ -z "$TAG" ]; then
            echo "No v* tag found after bump" >&2
            exit 1
          fi
          echo "Checking out ${TAG}"
          git checkout "${TAG}"

      - name: Read extension version
        id: meta
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Packaging YouTube Short Blocker v${VERSION}"

      - name: Stage package contents
        run: |
          STAGE=dist/extension
          mkdir -p "$STAGE"
          cp manifest.json LICENSE README.md "$STAGE/"
          cp -R content icons "$STAGE/"
          # Optional VERSION file if present
          if [ -f VERSION ]; then cp VERSION "$STAGE/"; fi
          find "$STAGE" -name '.DS_Store' -delete
          echo "Staged files:"
          find "$STAGE" -type f | sort

      - name: Pack Chromium zip (Chrome / Edge / Brave / Opera)
        run: |
          OUT="$PWD/youtube-short-blocker-chromium-v${{ steps.meta.outputs.version }}.zip"
          (cd dist/extension && zip -r "$OUT" .)
          echo "CHROMIUM_ZIP=$OUT" >> "$GITHUB_ENV"
          ls -lh "$OUT"
          unzip -l "$OUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Pack Firefox zip (web-ext)
        run: |
          npx --yes web-ext@8 build \
            --source-dir dist/extension \
            --artifacts-dir ./web-ext-artifacts \
            --filename "youtube-short-blocker-firefox-v${{ steps.meta.outputs.version }}.zip" \
            --overwrite-dest
          FIREFOX_ZIP="$PWD/web-ext-artifacts/youtube-short-blocker-firefox-v${{ steps.meta.outputs.version }}.zip"
          echo "FIREFOX_ZIP=$FIREFOX_ZIP" >> "$GITHUB_ENV"
          ls -lh web-ext-artifacts/
          unzip -l "$FIREFOX_ZIP"

      - name: Upload Chromium package
        uses: actions/upload-artifact@v4
        with:
          name: youtube-short-blocker-chromium-v${{ steps.meta.outputs.version }}
          path: ${{ env.CHROMIUM_ZIP }}
          if-no-files-found: error

      - name: Upload Firefox package
        uses: actions/upload-artifact@v4
        with:
          name: youtube-short-blocker-firefox-v${{ steps.meta.outputs.version }}
          path: ${{ env.FIREFOX_ZIP }}
          if-no-files-found: error

      # Release assets: after auto-bump on main, on v* tags, or when a Release is published.
      - name: Attach packages to GitHub Release
        if: ${{ github.event_name == 'workflow_run' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.CHROMIUM_ZIP }}
            ${{ env.FIREFOX_ZIP }}
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
